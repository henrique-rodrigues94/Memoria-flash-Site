<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#171A2B" />
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
<meta name="description" content="MemoriaFlash Web: acesse no computador seus baralhos, flashcards e progresso." />
<title>MemoriaFlash Web — Estudo</title>
<link rel="canonical" href="/" />
<link rel="stylesheet" href="/progress.css" />
<link rel="stylesheet" href="/library.css" />
<link rel="stylesheet" href="/help.css" />
<link rel="stylesheet" href="/login.css" />
<style>
.streak-card{display:none!important}.topbar .profile{display:none!important}.progress-metrics{grid-template-columns:repeat(3,minmax(0,1fr))!important}.progress-metrics .progress-metric:last-child{display:none!important}@media(max-width:760px){.progress-metrics{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
#root{min-height:100vh}
#app-fallback{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f7fb;color:#171a2b;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app-fallback .fallback-card{width:min(440px,100%);background:#fff;border:1px solid #e5e7ee;border-radius:20px;padding:30px;text-align:center;box-shadow:0 18px 50px rgba(23,26,43,.08)}#app-fallback .fallback-icon{width:48px;height:48px;margin:0 auto 14px;border-radius:14px;background:#efedff;color:#6d5dfc;display:grid;place-items:center;font-size:23px}#app-fallback h1{font-size:21px;margin:0 0 8px}#app-fallback p{color:#747b8f;font-size:13px;line-height:1.6;margin:0 0 20px}#app-fallback button{border:0;border-radius:11px;padding:11px 17px;background:#6d5dfc;color:#fff;font-weight:800;cursor:pointer}
</style>
</head>
<body class="app-mode">
<div id="root"><div id="app-fallback"><div class="fallback-card"><div class="fallback-icon">🧠</div><h1>Carregando o MemoriaFlash...</h1><p>Estamos preparando seu ambiente de estudos.</p><button type="button" onclick="window.location.reload()">Tentar novamente</button></div></div></div>
<noscript><main style="max-width:900px;margin:40px auto;padding:24px;font-family:Arial,sans-serif"><h1>MemoriaFlash Web</h1><p>Ative o JavaScript para acessar sua área de estudos.</p></main></noscript>
<script>
(()=>{
  document.body.classList.add('app-mode');
  window.addEventListener('error',(event)=>{if(event.filename&&event.filename.includes('/assets/')){const box=document.querySelector('#app-fallback p');if(box)box.textContent='Não foi possível carregar o aplicativo. Atualize a página e tente novamente.';}});
  window.addEventListener('unhandledrejection',()=>{const box=document.querySelector('#app-fallback p');if(box)box.textContent='Ocorreu um erro ao iniciar o aplicativo. Atualize a página e tente novamente.';});
})();
</script>
<script type="module">import { createRoot } from "react-dom/client"; globalThis.createRoot = createRoot;</script>
<script type="module" src="/src/main.jsx"></script>
<script src="/login.js" defer></script>
<!-- O antigo help.js enviava feedback por mailto. O fluxo atual usa HelpPage + Firestore. -->
</body>
</html>
